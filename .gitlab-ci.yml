stages:
- build
- release

variables:
  GO111MODULE: "on"
  GOPRIVATE: "git.dslab.cc,dslab.sjtu"
  GONOSUMDB: "git.dslab.cc,dslab.sjtu"
  GOPROXY: "https://goproxy.cn,direct"
  GIT_TERMINAL_PROMPT: "0"

build:
  stage: build
  image: harbor.dslab.cc/proxy/library/golang:1.24
  tags:
  - linux
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
  - apt update && apt install -y make bash git openssh-client ca-certificates
  - |
    GITLAB_USER="${CI_DEPLOY_USER:-gitlab-ci-token}"
    GITLAB_PASSWORD="${CI_DEPLOY_PASSWORD:-$CI_JOB_TOKEN}"
    git config --global url."https://${GITLAB_USER}:${GITLAB_PASSWORD}@git.dslab.cc/".insteadOf "https://git.dslab.cc/"
    git config --global url."https://${GITLAB_USER}:${GITLAB_PASSWORD}@git.dslab.cc/".insteadOf "git+ssh://git.dslab.cc/"
    git config --global url."https://${GITLAB_USER}:${GITLAB_PASSWORD}@git.dslab.cc/".insteadOf "ssh://git.dslab.cc/"
  - go env -w GOPROXY="${GOPROXY}" GOPRIVATE="${GOPRIVATE}" GONOPROXY="${GOPRIVATE}" GONOSUMDB="${GONOSUMDB}"
  - go mod download
  - make all
  artifacts:
    paths:
      - build/linux/amd64/kubenet-config-generator
      - build/linux/arm64/kubenet-config-generator
      - build/windows/amd64/kubenet-config-generator.exe

release:
  stage: release
  image: harbor.dslab.cc/gitlab/release-cli:latest
  dependencies:
  - build
  release:
    name: $CI_COMMIT_TAG
    description: $CI_COMMIT_MESSAGE
    tag_name: $CI_COMMIT_TAG
    ref: $CI_COMMIT_TAG
    assets:
      links:
      - name: linux/amd64
        url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/build/linux/amd64/kubenet-config-generator"
      - name: linux/arm64
        url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/build/linux/arm64/kubenet-config-generator"
      - name: windows/amd64
        url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/build/windows/amd64/kubenet-config-generator.exe"
  rules:
  - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
  - echo "Release $CI_COMMIT_TAG"
  artifacts:
    paths:
      - build/linux/amd64/kubenet-config-generator
      - build/linux/arm64/kubenet-config-generator
      - build/windows/amd64/kubenet-config-generator.exe

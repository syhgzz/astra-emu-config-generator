link_models:
- name: Satellite
  param:
    bandwidth: 72e6
    bit_rate: 10e6
    frequency: 20e9
    mode: "BPSK"
    packet_size_in_bit: 1024
    redundancy: 1
    type: GeneralWirelessLink
    model: Satellite
    calc_penetration: true
- name: 5G
  param:
    bandwidth: 1e+08
    bit_rate: 1e+09
    frequency: 28e+09
    mode: QPSK
    packet_size_in_bit: 1024
    redundancy: 1
    type: GeneralWirelessLink
    model: 5G
    calc_penetration: true
- name: satlaser
  param:
    type: SatelliteLaserLink
    bandwidth: 10Gbps
    single_hop_latency: 1ms
network_nodes:
fading_models:
- name: fading_model1
  a_sigma: 1.01
  b_sigma: 0.0039
  k_factor: 1
  "n": 4.2
  num_of_m: 0
  relative_delays: null
  sigma: 30
  tau: 1.2
topology_models:
- name: cone1
  param:
    type: SatelliteConeTopo
    angle: 150
    max_distance: 3e+06
- name: cone2
  param:
    type: SatelliteConeTopo
    angle: 150
    max_distance: 3e+06
- name: cone3
  param:
    type: SatelliteConeTopo
    angle: 150
    max_distance: 3e+06
- name: fixed1
  param:
    type: FixedTopo
- name: walkerinter
  param:
    type: WalkerInterSatTopo  
    default_angle: 140
routing_areas:
- id: 1
  param:
    area: 0.0.0.1
    type: OSPFV3
    subnet_mask: 112
    supernet: FD00:aaaa:aaaa::1
    supernet_mask: 96
    throttle_spf: "5000 10000 50000"
  protocol: OSPFV3
- id: 2
  param:
    area: 0.0.0.2
    type: OSPFV3
    subnet_mask: 112
    supernet: FD00:aaaa:bbbb::1
    supernet_mask: 96
    hello_interval: 10
    dead_interval: 40
    retransmit_interval: 5
    transmit_delay: 1
    throttle_spf: "200 400 10000"
    lsa_min_arrival: 2000
  protocol: OSPFV3
- id: 3
  param:
    area: 0.0.0.3
    type: OSPFV3
    subnet_mask: 112
    supernet: FD00:aaaa:cccc::1
    supernet_mask: 96
    hello_interval: 10
    dead_interval: 40
    retransmit_interval: 5
    transmit_delay: 1
    throttle_spf: "200 400 10000"
    lsa_min_arrival: 2000
  protocol: OSPFV3
constellations:
extra:
  start_timestamp: 2023-10-01T12:00:00Z
